- company: Harborline
  title: Senior Backend Engineer (Python)
  location: San Francisco, CA (Hybrid)
  work_mode: hybrid
  salary_text: USD 175,000–215,000 / YEAR
  description: |
    Harborline builds scheduling and dispatch software for regional ferry and shuttle operators.
    We're hiring a Senior Backend Engineer to own services behind our operator dashboard and
    public booking APIs.

    What you'll do
    - Design and build REST APIs in Python (FastAPI) backed by PostgreSQL
    - Own data models for schedules, vessels and bookings, and the migrations that change them
    - Improve reliability: tests, observability, and on-call for the services you own
    - Work with our two frontend engineers on API contracts for the React dashboard

    What we're looking for
    - 6+ years building backend services in production
    - Strong Python, or deep experience in another backend language and willingness to switch
    - Solid relational database skills (PostgreSQL preferred)
    - Experience designing and versioning public APIs
    - Nice to have: AWS, event-driven systems, transportation or logistics domain

    Hybrid: 2 days a week in our San Francisco office.

- company: Tessellate AI
  title: Senior Software Engineer, Agent Platform
  location: San Francisco, CA
  work_mode: hybrid
  salary_text: USD 190,000–240,000 / YEAR
  description: |
    Tessellate AI helps finance teams automate close and reconciliation with AI agents. The Agent
    Platform team builds the runtime our agents run on: tool calling, evaluation and guardrails.

    Responsibilities
    - Build and operate the agent runtime in Python: tool integrations, retries, model fallback
    - Expose internal systems to agents through MCP servers with clear, typed tools
    - Build evaluation pipelines that measure agent quality against labeled datasets
    - Partner with product teams shipping agent features to customers

    Requirements
    - 5+ years of backend engineering experience
    - Python in production
    - Hands-on experience building LLM or agent systems (frameworks such as LangGraph or ADK a plus)
    - Comfort with SQL and data modeling
    - Nice to have: MCP, A2A, experience evaluating LLM output

    We work hybrid from our San Francisco office three days a week.

