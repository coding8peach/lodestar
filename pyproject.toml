[project]
name = "lodestar"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Karen Yang", email = "212205507+coding8peach@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "google-adk[a2a,extensions]>=2.10.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.12",
    "mcp>=2.2.0",
    "pydantic>=2.13.5",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "streamlit>=1.64.0",
]

[project.scripts]
lodestar = "lodestar.workflow.cli:main"
lodestar-mcp = "lodestar.mcp_server.server:main"
lodestar-agent = "lodestar.fit_agent.server:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
